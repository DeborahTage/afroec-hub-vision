# application-prod.yml
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      # Prefer validate in locked-down prod once schema is stable; update kept for Render bootstraps.
      ddl-auto: ${JPA_DDL_AUTO:update}

  thymeleaf:
    cache: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    include-path: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.afroechub: INFO
    root: WARN

admin:
  localhost-only: ${ADMIN_LOCALHOST_ONLY:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://afroec.com,https://www.afroec.com,https://afroec.vercel.app,https://www.afroec.vercel.app}
  security:
    cookie-secure: true
    require-json-content-type: true
  rate-limit:
    submissions-per-minute: ${RATE_LIMIT_SUBMISSIONS:10}
    login-per-minute: ${RATE_LIMIT_LOGIN:5}
