<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('CMS Blog')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('CMS Blog')}"></header>
        <main class="admin-content">

            <form class="card p-3 mb-3" th:action="@{/admin/cms/blog}" method="post">
              <div class="row g-2">
                <div class="col-md-6"><input class="form-control" name="title" placeholder="Title" required/></div>
                <div class="col-md-6"><input class="form-control" name="slug" placeholder="slug-optional"/></div>
                <div class="col-md-4"><input class="form-control" name="author" placeholder="Author"/></div>
                <div class="col-md-4"><input class="form-control" name="category" placeholder="Category"/></div>
                <div class="col-md-4">
                  <select class="form-select" name="status">
                    <option value="DRAFT">DRAFT</option>
                    <option value="PUBLISHED">PUBLISHED</option>
                  </select>
                </div>
                <div class="col-12"><textarea class="form-control" name="excerpt" rows="2" placeholder="Excerpt"></textarea></div>
                <div class="col-12"><textarea class="form-control" name="content" rows="6" placeholder="Content"></textarea></div>
                <div class="col-12"><button class="btn btn-dark">Create Post</button></div>
              </div>
            </form>
            <div class="card"><div class="table-responsive">
              <table class="table mb-0">
                <thead><tr><th>Title</th><th>Status</th><th>Author</th><th></th></tr></thead>
                <tbody>
                  <tr th:each="p : ${posts}">
                    <td th:text="${p.title}"></td>
                    <td th:text="${p.status}"></td>
                    <td th:text="${p.author}"></td>
                    <td>
                      <form th:action="@{/admin/cms/blog/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Delete?')">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                      </form>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div></div>

        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
