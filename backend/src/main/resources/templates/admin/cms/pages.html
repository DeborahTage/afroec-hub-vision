<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('CMS Pages')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('CMS Pages')}"></header>
        <main class="admin-content">

            <div class="card p-3 mb-3">
              <form th:action="@{/admin/cms/pages/homepage}" method="post">
                <input type="hidden" name="title" value="Homepage"/>
                <label class="form-label">Homepage content</label>
                <textarea class="form-control mb-2" name="content" rows="8"></textarea>
                <input class="form-control mb-2" name="metaTitle" placeholder="Meta title"/>
                <textarea class="form-control mb-2" name="metaDescription" rows="2" placeholder="Meta description"></textarea>
                <div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="published" value="true" checked id="p"/><label for="p" class="form-check-label">Published</label></div>
                <button class="btn btn-dark">Save Homepage CMS</button>
              </form>
            </div>
            <div class="card"><div class="table-responsive">
              <table class="table mb-0">
                <thead><tr><th>Key</th><th>Title</th><th>Published</th><th>Updated</th></tr></thead>
                <tbody>
                  <tr th:each="p : ${pages}">
                    <td th:text="${p.pageKey}"></td>
                    <td th:text="${p.title}"></td>
                    <td th:text="${p.published}"></td>
                    <td th:text="${p.updatedAt}"></td>
                  </tr>
                </tbody>
              </table>
            </div></div>

        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
