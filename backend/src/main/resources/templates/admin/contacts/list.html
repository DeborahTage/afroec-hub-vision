<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Contacts')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Contact Submissions')}"></header>
        <main class="admin-content">
            <div class="card p-3 mb-3">
                <form class="row g-2 align-items-end" method="get" th:action="@{/admin/contacts}">
                    <div class="col-md-5">
                        <label class="form-label">Search</label>
                        <input type="text" name="q" class="form-control" th:value="${q}"
                               placeholder="Name or email"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="">All</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                    th:selected="${status != null and status.name() == s.name()}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">Filter</button>
                    </div>
                </form>
            </div>
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0">Results (<span th:text="${page.totalElements}">0</span>)</h6>
                    <a th:href="@{/admin/export/contacts}" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-download"></i> Export CSV
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr><th>ID</th><th>Name</th><th>Email</th><th>Subject</th>
                            <th>Status</th><th>Received</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${contacts}">
                            <td th:text="${c.id}">1</td>
                            <td th:text="${c.name}">Name</td>
                            <td th:text="${c.email}">email</td>
                            <td><span class="badge bg-info text-dark" th:text="${c.subject}">-</span></td>
                            <td><span class="badge bg-secondary" th:text="${c.status}">-</span></td>
                            <td th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd')}">-</td>
                            <td><a th:href="@{/admin/contacts/{id}(id=${c.id})}"
                                   class="btn btn-sm btn-outline-primary">View</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contacts)}">
                            <td colspan="7" class="text-center text-muted py-4">No submissions found</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/contacts')}"></nav>
            </div>
        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{admin/fragments/footer :: scripts}"></div>
</body>
</html>
