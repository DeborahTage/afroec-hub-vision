<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Partner Detail')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Partner Detail')}"></header>
        <main class="admin-content">
            <a th:href="@{/admin/partners}" class="btn btn-sm btn-link mb-2">
                <i class="bi bi-arrow-left"></i> Back to list
            </a>
            <div class="row g-3">
                <div class="col-lg-8">
                    <div class="card p-4">
                        <h4 th:text="${partner.organizationName}">Org</h4>
                        <p class="text-muted mb-4">
                            <span th:text="${partner.contactPerson}">Contact</span> ·
                            <span th:text="${partner.email}">email</span> ·
                            <span th:text="${partner.phone}">phone</span>
                        </p>
                        <dl class="row">
                            <dt class="col-sm-4">Type</dt><dd class="col-sm-8" th:text="${partner.organizationType}">-</dd>
                            <dt class="col-sm-4">Interests</dt>
                            <dd class="col-sm-8">
                                <span class="badge bg-light text-dark me-1"
                                      th:each="i : ${partner.partnershipInterest}" th:text="${i}">interest</span>
                            </dd>
                            <dt class="col-sm-4">Message</dt><dd class="col-sm-8" th:text="${partner.message}">-</dd>
                            <dt class="col-sm-4">Received</dt><dd class="col-sm-8" th:text="${#temporals.format(partner.createdAt, 'yyyy-MM-dd HH:mm')}">-</dd>
                        </dl>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card p-4">
                        <h6>Manage</h6>
                        <form th:action="@{/admin/partners/{id}/update(id=${partner.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-select">
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                            th:selected="${partner.status != null and partner.status.name() == s.name()}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Assigned to</label>
                                <input type="text" name="assignedTo" class="form-control" th:value="${partner.assignedTo}"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Notes</label>
                                <textarea name="notes" class="form-control" rows="4" th:text="${partner.notes}"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Save changes</button>
                        </form>
                        <hr/>
                        <form th:action="@{/admin/partners/{id}/delete(id=${partner.id})}" method="post"
                              onsubmit="return confirm('Delete this inquiry?');">
                            <button type="submit" class="btn btn-outline-danger w-100">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{admin/fragments/footer :: scripts}"></div>
</body>
</html>
