<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Internship')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Internship Detail')}"></header>
        <main class="admin-content">

            <div class="row g-3">
              <div class="col-lg-8"><div class="card p-3">
                <dl class="row mb-0">
                  <dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${item.email}"></dd>
                  <dt class="col-sm-4">Phone</dt><dd class="col-sm-8" th:text="${item.phone}"></dd>
                  <dt class="col-sm-4">Institution</dt><dd class="col-sm-8" th:text="${item.institution}"></dd>
                  <dt class="col-sm-4">Field</dt><dd class="col-sm-8" th:text="${item.fieldOfStudy}"></dd>
                  <dt class="col-sm-4">Department</dt><dd class="col-sm-8" th:text="${item.department}"></dd>
                  <dt class="col-sm-4">Duration</dt><dd class="col-sm-8" th:text="${item.duration}"></dd>
                  <dt class="col-sm-4">Start</dt><dd class="col-sm-8" th:text="${item.startDate}"></dd>
                  <dt class="col-sm-4">Motivation</dt><dd class="col-sm-8" th:text="${item.motivationAfroec}"></dd>
                  <dt class="col-sm-4">Learning goals</dt><dd class="col-sm-8" th:text="${item.learningGoals}"></dd>
                  <dt class="col-sm-4">CV</dt><dd class="col-sm-8"><a th:href="${item.cvUrl}" th:text="${item.cvUrl}" target="_blank" rel="noreferrer"></a></dd>
                </dl>
              </div></div>
              <div class="col-lg-4"><div class="card p-3">
                <form th:action="@{/admin/internships/{id}/update(id=${item.id})}" method="post">
                  <select class="form-select mb-2" name="status">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == item.status}"></option>
                  </select>
                  <textarea class="form-control mb-2" name="notes" rows="4" th:text="${item.notes}"></textarea>
                  <button class="btn btn-dark w-100">Save</button>
                </form>
              </div></div>
            </div>

        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
