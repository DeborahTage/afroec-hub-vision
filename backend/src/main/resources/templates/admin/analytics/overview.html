<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Analytics')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Visitor Analytics')}"></header>
        <main class="admin-content">

            <div class="row g-3 mb-4">
              <div class="col-md-4"><div class="card p-3"><div class="text-muted small">Total Visits</div><div class="fs-3 fw-bold" th:text="${stats.totalVisits}">0</div><div class="small text-success" th:text="'↑ ' + ${stats.visitsChangePct} + '% (7d)'"></div></div></div>
              <div class="col-md-4"><div class="card p-3"><div class="text-muted small">Unique Visitors</div><div class="fs-3 fw-bold" th:text="${stats.uniqueVisitors}">0</div></div></div>
              <div class="col-md-4"><div class="card p-3"><div class="text-muted small">Page Views</div><div class="fs-3 fw-bold" th:text="${stats.pageViews}">0</div></div></div>
            </div>
            <div class="row g-3">
              <div class="col-lg-6"><div class="card p-3"><h2 class="h6">Traffic Sources</h2>
                <ul class="list-unstyled mb-0"><li th:each="e : ${stats.trafficSources}" class="d-flex justify-content-between border-bottom py-2"><span th:text="${e.key}"></span><strong th:text="${e.value}"></strong></li></ul>
              </div></div>
              <div class="col-lg-6"><div class="card p-3"><h2 class="h6">Popular Pages</h2>
                <ul class="list-unstyled mb-0"><li th:each="e : ${stats.popularPages}" class="d-flex justify-content-between border-bottom py-2"><span th:text="${e.key}"></span><strong th:text="${e.value}"></strong></li></ul>
              </div></div>
              <div class="col-lg-6"><div class="card p-3"><h2 class="h6">Devices</h2>
                <ul class="list-unstyled mb-0"><li th:each="e : ${stats.devices}" class="d-flex justify-content-between border-bottom py-2"><span th:text="${e.key}"></span><strong th:text="${e.value}"></strong></li></ul>
              </div></div>
              <div class="col-lg-6"><div class="card p-3"><h2 class="h6">Geographic</h2>
                <ul class="list-unstyled mb-0"><li th:each="e : ${stats.geo}" class="d-flex justify-content-between border-bottom py-2"><span th:text="${e.key}"></span><strong th:text="${e.value}"></strong></li></ul>
              </div></div>
            </div>

        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
