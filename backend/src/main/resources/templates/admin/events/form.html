<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Create Event')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Create Event')}"></header>
        <main class="admin-content">

            <form class="card p-3" th:action="@{/admin/events}" method="post">
              <div class="mb-2"><label class="form-label">Title</label><input class="form-control" name="title" required/></div>
              <div class="mb-2"><label class="form-label">Slug</label><input class="form-control" name="slug"/></div>
              <div class="mb-2"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
              <div class="mb-2"><label class="form-label">Content</label><textarea class="form-control" name="content" rows="6"></textarea></div>
              <div class="row g-2">
                <div class="col-md-4"><label class="form-label">Date</label><input type="date" class="form-control" name="eventDate"/></div>
                <div class="col-md-4"><label class="form-label">Time</label><input type="time" class="form-control" name="eventTime"/></div>
                <div class="col-md-4"><label class="form-label">Category</label><input class="form-control" name="category" placeholder="Workshop"/></div>
              </div>
              <div class="mb-2 mt-2"><label class="form-label">Location</label><input class="form-control" name="location"/></div>
              <div class="mb-2"><label class="form-label">Image URL</label><input class="form-control" name="imageUrl"/></div>
              <div class="mb-2"><label class="form-label">Status</label>
                <select class="form-select" name="status">
                  <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
              </div>
              <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="published" value="true" id="pub"/><label class="form-check-label" for="pub">Published</label></div>
              <button class="btn btn-dark">Create</button>
            </form>

        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
