<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Events')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Events')}"></header>
        <main class="admin-content">

            <div class="d-flex justify-content-between mb-3">
              <div></div>
              <a class="btn btn-dark" th:href="@{/admin/events/new}">Create Event</a>
            </div>
            <div class="card"><div class="table-responsive">
              <table class="table mb-0">
                <thead><tr><th>Title</th><th>Date</th><th>Status</th><th>Published</th><th></th></tr></thead>
                <tbody>
                  <tr th:each="e : ${events}">
                    <td th:text="${e.title}"></td>
                    <td th:text="${e.eventDate}"></td>
                    <td th:text="${e.status}"></td>
                    <td th:text="${e.published}"></td>
                    <td><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/events/{id}(id=${e.id})}">Manage</a></td>
                  </tr>
                </tbody>
              </table>
            </div></div>

        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
