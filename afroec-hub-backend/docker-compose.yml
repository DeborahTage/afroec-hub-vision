services:
  db:
    image: postgres:15-alpine
    container_name: afroec-hub-db
    environment:
      POSTGRES_DB: afroec_hub
      POSTGRES_USER: afroec_admin
      POSTGRES_PASSWORD: afroec_admin
    ports:
      - "5432:5432"
    volumes:
      - afroec_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afroec_admin -d afroec_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: afroec-hub-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/afroec_hub
      DATABASE_USERNAME: afroec_admin
      DATABASE_PASSWORD: afroec_admin
      JWT_SECRET: local-dev-secret-please-change-this-to-a-long-random-value-000000
      ADMIN_PASSWORD: Admin@12345
      # Allow the admin dashboard through the container network in local dev.
      ADMIN_LOCALHOST_ONLY: "false"
    ports:
      - "8080:8080"

volumes:
  afroec_pgdata:
