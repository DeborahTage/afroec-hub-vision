<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Applications')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Student Applications')}"></header>
        <main class="admin-content">

            <div class="card p-3 mb-3">
                <form class="row g-2 align-items-end" method="get" th:action="@{/admin/applications}">
                    <div class="col-md-4">
                        <label class="form-label">Search</label>
                        <input type="text" name="q" class="form-control" th:value="${q}"
                               placeholder="Name or email"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="">All</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                    th:selected="${status != null and status.name() == s.name()}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Program</label>
                        <select name="program" class="form-select">
                            <option value="">All</option>
                            <option th:each="p : ${programs}" th:value="${p}" th:text="${p}"
                                    th:selected="${program != null and program.name() == p.name()}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">Filter</button>
                    </div>
                </form>
            </div>

            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0">Results (<span th:text="${page.totalElements}">0</span>)</h6>
                    <a th:href="@{/admin/export/applications}" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-download"></i> Export CSV
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Email</th><th>Program</th>
                            <th>Track/Program</th><th>Status</th><th>Submitted</th><th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${applications}">
                            <td th:text="${a.id}">1</td>
                            <td th:text="${a.fullName}">Name</td>
                            <td th:text="${a.email}">email</td>
                            <td><span class="badge bg-info text-dark" th:text="${a.programType}">-</span></td>
                            <td th:text="${a.academyTrack != null ? a.academyTrack : a.communityProgram}">-</td>
                            <td><span class="badge bg-secondary badge-status" th:text="${a.status}">-</span></td>
                            <td th:text="${#temporals.format(a.createdAt, 'yyyy-MM-dd')}">-</td>
                            <td>
                                <a th:href="@{/admin/applications/{id}(id=${a.id})}"
                                   class="btn btn-sm btn-outline-primary">View</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(applications)}">
                            <td colspan="8" class="text-center text-muted py-4">No applications found</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav th:replace="~{admin/fragments/pagination :: pagination(${page}, '/admin/applications')}"></nav>
            </div>

        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{admin/fragments/footer :: scripts}"></div>
</body>
</html>
