<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="pagination(page, baseUrl)" th:if="${page.totalPages > 1}" aria-label="Pagination">
    <ul class="pagination justify-content-center mt-3">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{${baseUrl}(page=${page.number - 1}, size=${page.size})}">Previous</a>
        </li>
        <li class="page-item disabled">
            <span class="page-link">
                Page <span th:text="${page.number + 1}">1</span>
                of <span th:text="${page.totalPages}">1</span>
                (<span th:text="${page.totalElements}">0</span> total)
            </span>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{${baseUrl}(page=${page.number + 1}, size=${page.size})}">Next</a>
        </li>
    </ul>
</nav>
</body>
</html>
