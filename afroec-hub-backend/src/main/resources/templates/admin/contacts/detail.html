<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Contact Detail')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Contact Detail')}"></header>
        <main class="admin-content">
            <a th:href="@{/admin/contacts}" class="btn btn-sm btn-link mb-2">
                <i class="bi bi-arrow-left"></i> Back to list
            </a>
            <div class="row g-3">
                <div class="col-lg-8">
                    <div class="card p-4">
                        <h4 th:text="${contact.name}">Name</h4>
                        <p class="text-muted mb-4">
                            <span th:text="${contact.email}">email</span> ·
                            <span th:text="${contact.phone}">phone</span>
                        </p>
                        <dl class="row">
                            <dt class="col-sm-3">Subject</dt><dd class="col-sm-9" th:text="${contact.subject}">-</dd>
                            <dt class="col-sm-3">Message</dt><dd class="col-sm-9" th:text="${contact.message}">-</dd>
                            <dt class="col-sm-3">Status</dt><dd class="col-sm-9" th:text="${contact.status}">-</dd>
                            <dt class="col-sm-3">Received</dt><dd class="col-sm-9" th:text="${#temporals.format(contact.createdAt, 'yyyy-MM-dd HH:mm')}">-</dd>
                            <dt class="col-sm-3" th:if="${contact.responded}">Response</dt>
                            <dd class="col-sm-9" th:if="${contact.responded}" th:text="${contact.responseText}">-</dd>
                        </dl>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card p-4 mb-3">
                        <h6>Reply</h6>
                        <form th:action="@{/admin/contacts/{id}/reply(id=${contact.id})}" method="post">
                            <div class="mb-3">
                                <textarea name="responseText" class="form-control" rows="5"
                                          placeholder="Type your reply..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-send"></i> Send &amp; mark resolved
                            </button>
                        </form>
                    </div>
                    <div class="card p-4">
                        <h6>Status</h6>
                        <form th:action="@{/admin/contacts/{id}/status(id=${contact.id})}" method="post" class="d-flex gap-2">
                            <select name="status" class="form-select">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                        th:selected="${contact.status != null and contact.status.name() == s.name()}"></option>
                            </select>
                            <button type="submit" class="btn btn-outline-primary">Set</button>
                        </form>
                        <hr/>
                        <form th:action="@{/admin/contacts/{id}/delete(id=${contact.id})}" method="post"
                              onsubmit="return confirm('Delete this submission?');">
                            <button type="submit" class="btn btn-outline-danger w-100">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{admin/fragments/footer :: scripts}"></div>
</body>
</html>
