<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Volunteer Detail')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Volunteer Detail')}"></header>
        <main class="admin-content">
            <a th:href="@{/admin/volunteers}" class="btn btn-sm btn-link mb-2">
                <i class="bi bi-arrow-left"></i> Back to list
            </a>
            <div class="row g-3">
                <div class="col-lg-8">
                    <div class="card p-4">
                        <h4 th:text="${volunteer.fullName}">Name</h4>
                        <p class="text-muted mb-4">
                            <span th:text="${volunteer.email}">email</span> ·
                            <span th:text="${volunteer.phone}">phone</span> ·
                            <span th:text="${volunteer.city}">city</span>
                        </p>
                        <dl class="row">
                            <dt class="col-sm-4">Primary Role</dt><dd class="col-sm-8" th:text="${volunteer.primaryRole}">-</dd>
                            <dt class="col-sm-4">Secondary Role</dt><dd class="col-sm-8" th:text="${volunteer.secondaryRole}">-</dd>
                            <dt class="col-sm-4">Availability</dt><dd class="col-sm-8" th:text="${volunteer.availability}">-</dd>
                            <dt class="col-sm-4">Hours / week</dt><dd class="col-sm-8" th:text="${volunteer.hoursPerWeek}">-</dd>
                            <dt class="col-sm-4">Commitment</dt><dd class="col-sm-8" th:text="${volunteer.commitmentDuration}">-</dd>
                            <dt class="col-sm-4">Experience</dt><dd class="col-sm-8" th:text="${volunteer.experienceLevel}">-</dd>
                            <dt class="col-sm-4">Background</dt><dd class="col-sm-8" th:text="${volunteer.professionalBackground}">-</dd>
                            <dt class="col-sm-4">Motivation</dt><dd class="col-sm-8" th:text="${volunteer.motivation}">-</dd>
                            <dt class="col-sm-4">Skills</dt>
                            <dd class="col-sm-8">
                                <span class="badge bg-light text-dark me-1"
                                      th:each="s : ${volunteer.skills}" th:text="${s}">skill</span>
                            </dd>
                            <dt class="col-sm-4">Languages</dt>
                            <dd class="col-sm-8">
                                <span class="badge bg-light text-dark me-1"
                                      th:each="l : ${volunteer.languages}" th:text="${l}">lang</span>
                            </dd>
                            <dt class="col-sm-4">Portfolio</dt><dd class="col-sm-8" th:text="${volunteer.portfolioLink}">-</dd>
                            <dt class="col-sm-4">Resume</dt><dd class="col-sm-8" th:text="${volunteer.resumeLink}">-</dd>
                            <dt class="col-sm-4">Submitted</dt><dd class="col-sm-8" th:text="${#temporals.format(volunteer.createdAt, 'yyyy-MM-dd HH:mm')}">-</dd>
                        </dl>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card p-4">
                        <h6>Manage</h6>
                        <form th:action="@{/admin/volunteers/{id}/update(id=${volunteer.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-select">
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                            th:selected="${volunteer.status != null and volunteer.status.name() == s.name()}"></option>
                                </select>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" name="onboarded" value="true"
                                       id="onboarded" th:checked="${volunteer.onboarded}"/>
                                <label class="form-check-label" for="onboarded">Onboarded</label>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Notes</label>
                                <textarea name="notes" class="form-control" rows="4" th:text="${volunteer.notes}"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Save changes</button>
                        </form>
                        <hr/>
                        <form th:action="@{/admin/volunteers/{id}/delete(id=${volunteer.id})}" method="post"
                              onsubmit="return confirm('Delete this application?');">
                            <button type="submit" class="btn btn-outline-danger w-100">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{admin/fragments/footer :: scripts}"></div>
</body>
</html>
