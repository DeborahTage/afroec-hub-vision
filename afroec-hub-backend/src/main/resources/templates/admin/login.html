<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Login')}"></head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="text-center mb-3">
            <img th:src="@{/images/logo.png}" alt="Afroec Hub" class="login-logo"/>
        </div>
        <p class="subtitle text-center">Admin Dashboard</p>

        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <input type="text" name="username" class="form-control" required autofocus/>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100"
                    style="background:var(--afh-primary);border:none">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>
    </div>
</div>
</body>
</html>
