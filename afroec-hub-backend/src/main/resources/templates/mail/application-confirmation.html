<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/></head>
<body style="font-family:Arial,sans-serif;background:#f1f5f9;padding:24px;">
<div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;">
    <div style="background:#0f766e;color:#fff;padding:24px;">
        <h2 style="margin:0;">Afroec Hub</h2>
    </div>
    <div style="padding:24px;color:#1e293b;">
        <p>Hi <strong th:text="${fullName}">Applicant</strong>,</p>
        <p>Thank you for your application to Afroec Hub. We have received it successfully.</p>
        <p th:if="${applicationId}">
            Your reference: <strong th:text="${applicationId}">AFH-2026-00001</strong>
        </p>
        <p th:if="${status}">
            Current status: <strong th:text="${status}">PENDING</strong>
        </p>
        <p>Our team will review your submission and get back to you within 2 weeks.</p>
        <p style="margin-top:24px;color:#64748b;font-size:13px;">
            — The Afroec Hub Team
        </p>
    </div>
</div>
</body>
</html>
