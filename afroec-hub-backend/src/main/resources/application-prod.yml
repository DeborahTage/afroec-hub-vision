# application-prod.yml — CORRECTED
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update

  thymeleaf:
    cache: true

server:
  port: ${PORT:8080}

logging:
  level:
    com.afroechub: INFO
    root: WARN

admin:
  localhost-only: ${ADMIN_LOCALHOST_ONLY:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://afroec.vercel.app,https://www.afroec.vercel.app,http://localhost:3000,http://localhost:5173}