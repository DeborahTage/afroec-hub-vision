# Root Render Blueprint — deploys Spring Boot from /backend
# Prefer explicit dockerContext so this works even if dashboard Root Directory is blank.
services:
  - type: web
    name: afroec-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: afroec-hub-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: afroec-hub-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: afroec-hub-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_LOCALHOST_ONLY
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://afroec.com,https://www.afroec.com,https://afroec.vercel.app,https://www.afroec.vercel.app,https://afroechub.com,https://www.afroechub.com,http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080"
      - key: ADMIN_EMAIL
        value: "support@afroec.com"
      - key: MAIL_FROM
        value: "support@afroec.com"
      - key: MAIL_ENABLED
        value: "false"
      - key: APP_BUILD_ID
        value: "20260719-full-apps-v10"

databases:
  - name: afroec-hub-db
    plan: starter
    databaseName: afroec_hub
    user: afroec_admin
