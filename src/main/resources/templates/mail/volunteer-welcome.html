<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/></head>
<body style="font-family:Arial,sans-serif;background:#f1f5f9;padding:24px;">
<div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;">
    <div style="background:#0f766e;color:#fff;padding:24px;">
        <h2 style="margin:0;">Afroec Hub · Volunteers</h2>
    </div>
    <div style="padding:24px;color:#1e293b;">
        <p>Hi <strong th:text="${fullName}">Volunteer</strong>,</p>
        <p>Thank you for offering your time and skills to Afroec Hub!</p>
        <p>We've received your volunteer application and will review it soon. If it's a match,
            we'll reach out with onboarding details.</p>
        <p style="margin-top:24px;color:#64748b;font-size:13px;">— The Afroec Hub Team</p>
    </div>
</div>
</body>
</html>
