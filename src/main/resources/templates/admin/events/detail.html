<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/layout :: head('Event')}"></head>
<body>
<div class="admin-wrapper">
    <nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
    <div class="admin-main">
        <header th:replace="~{admin/fragments/header :: header('Manage Event')}"></header>
        <main class="admin-content">

            <form class="card p-3 mb-3" th:action="@{/admin/events/{id}/update(id=${event.id})}" method="post">
              <div class="mb-2"><label class="form-label">Title</label><input class="form-control" name="title" th:value="${event.title}" required/></div>
              <div class="mb-2"><label class="form-label">Slug</label><input class="form-control" name="slug" th:value="${event.slug}"/></div>
              <div class="mb-2"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3" th:text="${event.description}"></textarea></div>
              <div class="mb-2"><label class="form-label">Content</label><textarea class="form-control" name="content" rows="6" th:text="${event.content}"></textarea></div>
              <div class="row g-2">
                <div class="col-md-4"><input type="date" class="form-control" name="eventDate" th:value="${event.eventDate}"/></div>
                <div class="col-md-4"><input type="time" class="form-control" name="eventTime" th:value="${event.eventTime}"/></div>
                <div class="col-md-4"><input class="form-control" name="category" th:value="${event.category}"/></div>
              </div>
              <div class="mb-2 mt-2"><input class="form-control" name="location" th:value="${event.location}"/></div>
              <div class="mb-2"><input class="form-control" name="imageUrl" th:value="${event.imageUrl}"/></div>
              <select class="form-select mb-2" name="status">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == event.status}"></option>
              </select>
              <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="published" value="true" th:checked="${event.published}" id="pub2"/><label class="form-check-label" for="pub2">Published</label></div>
              <button class="btn btn-dark">Save</button>
            </form>
            <h2 class="h5">Registrations</h2>
            <div class="card"><div class="table-responsive">
              <table class="table mb-0">
                <thead><tr><th>Name</th><th>Email</th><th>Institution</th><th>Date</th></tr></thead>
                <tbody>
                  <tr th:each="r : ${registrations}">
                    <td th:text="${r.fullName}"></td>
                    <td th:text="${r.email}"></td>
                    <td th:text="${r.institution}"></td>
                    <td th:text="${r.createdAt}"></td>
                  </tr>
                </tbody>
              </table>
            </div></div>

        </main>
        <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
